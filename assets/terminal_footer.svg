    </style>
  </defs>

  <rect x="1" y="1" width="898" height="158" rx="10" fill="none" stroke="#00d9ff" stroke-opacity="0.3" stroke-width="2" filter="url(#glow5)"/>

  <g clip-path="url(#wc5)">
