      <stop offset="0%" stop-color="#060a10"/>
      <stop offset="100%" stop-color="#0a1018"/>
    </linearGradient>
    <pattern id="grid5" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#0f2630" stroke-width="1"/>
    </pattern>
    <filter id="glow5" x="-50%" y="-50%" width="200%" height="200%">
