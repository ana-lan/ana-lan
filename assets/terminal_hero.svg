<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060a10"/>
      <stop offset="100%" stop-color="#0a1018"/>
    </linearGradient>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#0f2630" stroke-width="1"/>
    </pattern>

    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="48%" stop-color="#00e5ff" stop-opacity="0.06"/>
      <stop offset="52%" stop-color="#00e5ff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="windowClip">
      <rect x="1" y="1" width="898" height="418" rx="10"/>
    </clipPath>

    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      .scanmove { animation: scanmove 6s linear infinite; }
      @keyframes scanmove { 0% { transform: translateY(-420px); } 100% { transform: translateY(420px); } }
    </style>
  </defs>

  <!-- outer glow border -->
  <rect x="1" y="1" width="898" height="418" rx="10" fill="none" stroke="#00d9ff" stroke-opacity="0.35" stroke-width="2" filter="url(#glow)"/>

  <g clip-path="url(#windowClip)">
    <rect x="1" y="1" width="898" height="418" fill="url(#bgGrad)"/>
    <rect x="1" y="1" width="898" height="418" fill="url(#grid)"/>

    <!-- moving scan band -->
    <g class="scanmove">
      <rect x="1" y="0" width="898" height="420" fill="url(#scan)"/>
    </g>

    <!-- title bar -->
    <rect x="1" y="1" width="898" height="38" fill="#0d1620"/>
    <line x1="1" y1="39" x2="899" y2="39" stroke="#163445" stroke-width="1"/>

    <circle cx="26" cy="20" r="6" fill="#ff5f56"/>
    <circle cx="46" cy="20" r="6" fill="#ffbd2e"/>
    <circle cx="66" cy="20" r="6" fill="#27c93f"/>

    <text x="450" y="25" text-anchor="middle" class="mono" font-size="13" fill="#5a7d8c">ana-lan@portfolio — zsh — 90x24</text>

    <text x="872" y="25" text-anchor="end" class="mono" font-size="11" fill="#2a4452">●  online</text>

    <!-- body content -->
    <g class="mono">
      <text x="32" y="76" font-size="15" fill="#00e5ff" filter="url(#glowSoft)">ana-lan@portfolio</text>
      <text x="190" y="76" font-size="15" fill="#4a6a78">:</text>
      <text x="200" y="76" font-size="15" fill="#5ec4dc">~</text>
      <text x="218" y="76" font-size="15" fill="#4a6a78">$</text>
      <text x="234" y="76" font-size="15" fill="#dff4fb">whoami</text>

      <text x="32" y="110" font-size="26" font-weight="700" fill="#00e5ff" filter="url(#glow)">Anagha Hambir Langhe</text>

      <text x="32" y="142" font-size="15" fill="#7fb8cc">&gt; MS Computer Science @ UT Dallas — graduating May 2026</text>
      <text x="32" y="166" font-size="15" fill="#7fb8cc">&gt; ML Engineer · Data Engineer · Software Developer</text>

      <text x="32" y="206" font-size="15" fill="#00e5ff" filter="url(#glowSoft)">ana-lan@portfolio</text>
      <text x="190" y="206" font-size="15" fill="#4a6a78">:</text>
      <text x="200" y="206" font-size="15" fill="#5ec4dc">~</text>
      <text x="218" y="206" font-size="15" fill="#4a6a78">$</text>
      <text x="234" y="206" font-size="15" fill="#dff4fb">cat status.txt</text>

      <text x="32" y="238" font-size="14" fill="#5fe3b3">[ACTIVE]</text>
      <text x="120" y="238" font-size="14" fill="#9fd6e8">open to SWE / MLE / DE roles — open to relocation</text>

      <text x="32" y="262" font-size="14" fill="#ffcc66">[FOCUS]</text>
      <text x="120" y="262" font-size="14" fill="#9fd6e8">RAG systems · big data pipelines · applied ML</text>

      <text x="32" y="296" font-size="15" fill="#00e5ff" filter="url(#glowSoft)">ana-lan@portfolio</text>
      <text x="190" y="296" font-size="15" fill="#4a6a78">:</text>
      <text x="200" y="296" font-size="15" fill="#5ec4dc">~</text>
      <text x="218" y="296" font-size="15" fill="#4a6a78">$</text>
      <rect x="234" y="284" width="10" height="17" fill="#00e5ff" class="cursor"/>

      <line x1="32" y1="336" x2="868" y2="336" stroke="#163445" stroke-width="1"/>

      <text x="32" y="362" font-size="12" fill="#2f4f5c">linkedin.com/in/anagha-langhe</text>
      <text x="868" y="362" text-anchor="end" font-size="12" fill="#2f4f5c">github.com/ana-lan</text>
    </g>
  </g>
</svg>
