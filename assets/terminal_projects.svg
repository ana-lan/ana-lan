      <text x="478" y="302" font-size="12.5" fill="#8fb4c4">Smart-cradle CV + IoT system</text>
      <text x="478" y="322" font-size="12.5" fill="#5fe3b3">IEEE ICETSIS 2024 · Indian patent filed</text>

