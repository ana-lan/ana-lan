<svg width="900" height="430" viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060a10"/>
      <stop offset="100%" stop-color="#0a1018"/>
    </linearGradient>
    <pattern id="grid3" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#0f2630" stroke-width="1"/>
    </pattern>
    <filter id="glow3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="wc3"><rect x="1" y="1" width="898" height="428" rx="10"/></clipPath>
    <style>.mono { font-family: 'JetBrains Mono','Fira Code',Consolas,monospace; }</style>
  </defs>

  <rect x="1" y="1" width="898" height="428" rx="10" fill="none" stroke="#00d9ff" stroke-opacity="0.3" stroke-width="2" filter="url(#glow3)"/>

  <g clip-path="url(#wc3)">
    <rect x="1" y="1" width="898" height="428" fill="url(#bgGrad3)"/>
    <rect x="1" y="1" width="898" height="428" fill="url(#grid3)"/>

    <rect x="1" y="1" width="898" height="38" fill="#0d1620"/>
    <line x1="1" y1="39" x2="899" y2="39" stroke="#163445" stroke-width="1"/>
    <circle cx="26" cy="20" r="6" fill="#ff5f56"/>
